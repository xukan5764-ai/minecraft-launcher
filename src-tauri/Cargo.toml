[package]
name = "mclauncher"
version = "0.1.0"
description = "An open-source Minecraft launcher"
authors = ["xukan5764-ai"]
license = "GPL-3.0-only"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mclauncher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.0", features = ["fs", "process", "io-util", "macros", "sync", "time"] }
futures = "0.3.34"
anyhow = "1.0.104"
hex = "0.4.3"
sha1 = "0.11.0"
md-5 = "0.11.0"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
uuid = { version = "1.28.0", features = ["v4"] }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "charset", "http2", "system-proxy", "json", "form", "query", "gzip"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
